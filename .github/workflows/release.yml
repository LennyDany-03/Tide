# Publishes a new version of the Tide Android app.
#
# Starts after CI passes on main (or by hand from the Actions tab). It reads
# the version from product/pubspec.yaml and does nothing unless that version
# has no git tag yet, so an ordinary push to main never releases anything.
# When the version is new it:
#
#   1. checks CHANGELOG.md has finished notes for it,
#   2. builds a release APK signed with the Tide release key,
#   3. creates the GitHub Release vX.Y.Z with two files attached: the APK and
#      version.json, the update manifest.
#
# The app and the website read the manifest from
#   https://github.com/<owner>/<repo>/releases/latest/download/version.json
# which GitHub always points at the newest release. So nothing is ever
# committed back to main, and main can stay locked to pull requests.
#
# If a release exists but lost its version.json (an interrupted run), the
# next run attaches it without rebuilding anything.
#
# How to cut a release, and the secrets this needs: TRIGGER.md.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.4"
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

jobs:
  prepare:
    name: Is this a new version?
    # A workflow_run fires for failed CI runs too, and for pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      build_apk: ${{ steps.state.outputs.build_apk }}
      publish_manifest: ${{ steps.state.outputs.publish_manifest }}
      sha: ${{ steps.state.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI actually tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - id: info
        run: node scripts/release.mjs info

      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "build_apk=true" >> "$GITHUB_OUTPUT"
            echo "publish_manifest=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $TAG."
            exit 0
          fi

          echo "build_apk=false" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"
          if ! assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "publish_manifest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $TAG exists but has no GitHub Release. Delete the tag or bump the version (TRIGGER.md)."
          elif echo "$assets" | grep -qx "version.json"; then
            echo "publish_manifest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already released. Bump the version in product/pubspec.yaml to publish a new one."
          else
            echo "publish_manifest=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is released but has no version.json. Attaching it."
          fi

      - if: steps.state.outputs.build_apk == 'true'
        run: node scripts/release.mjs check

  build:
    name: Build signed APK
    needs: prepare
    if: needs.prepare.outputs.build_apk == 'true'
    runs-on: ubuntu-latest
    # No job outputs here on purpose. GitHub drops any job output containing
    # the text of a secret, and the APK name contains "tide", which is also
    # the key alias. The publish job works everything out from the file.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Every release must be signed with the same key, or Android refuses
      # the update. Refusing to build is better than publishing an APK no
      # existing install can accept.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See TRIGGER.md, 'One-time setup'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tide-release.jks"
          echo "TIDE_KEYSTORE_PATH=$RUNNER_TEMP/tide-release.jks" >> "$GITHUB_ENV"

      # Public, compile-time values only (see product/lib/config/). Missing
      # ones leave that feature in its offline/demo mode rather than failing.
      #
      # Secrets are often pasted as the whole .env line ("SUPABASE_URL=https://…")
      # rather than just the value. Compiled in like that, the app hands
      # Supabase a URL it cannot parse and never gets past the launch screen
      # (v1.0.1). So each value is reduced to the bare value first, and a URL
      # that is still not a URL stops the build instead of shipping.
      - name: Write build configuration
        working-directory: product
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL || format('{0}/{1}/releases/latest/download/version.json', github.server_url, github.repository) }}
        run: |
          # The value for $1 out of $2: the "NAME=" line if there is one, else
          # the first non-blank line, without "export", quotes or whitespace.
          value_of() {
            local lines line
            lines=$(printf '%s\n' "$2" | tr -d '\r')
            line=$(printf '%s\n' "$lines" | grep -m1 -E "^[[:space:]]*(export[[:space:]]+)?$1=" || true)
            [ -n "$line" ] || line=$(printf '%s\n' "$lines" | grep -m1 -v '^[[:space:]]*$' || true)
            printf '%s' "$line" | sed -E \
              -e "s/^[[:space:]]*(export[[:space:]]+)?$1=//" \
              -e 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              -e "s/^\"(.*)\"$/\1/; s/^'(.*)'$/\1/"
          }

          url=$(value_of SUPABASE_URL "$SUPABASE_URL")
          key=$(value_of SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY")
          google=$(value_of GOOGLE_WEB_CLIENT_ID "$GOOGLE_WEB_CLIENT_ID")
          manifest=$(value_of UPDATE_MANIFEST_URL "$UPDATE_MANIFEST_URL")

          fail=0
          if [ -n "$url" ] && ! [[ "$url" =~ ^https://[^[:space:]/]+(/[^[:space:]]*)?$ ]]; then
            echo "::error::SUPABASE_URL is not a URL. The secret must be just the value, e.g. https://abcd.supabase.co"
            fail=1
          fi
          if [[ "$key" =~ [[:space:]=] ]]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY looks malformed. The secret must be just the key, e.g. sb_publishable_…"
            fail=1
          fi
          if [ -n "$manifest" ] && ! [[ "$manifest" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::UPDATE_MANIFEST_URL is not a URL."
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          if { [ -n "$url" ] && [ -z "$key" ]; } || { [ -z "$url" ] && [ -n "$key" ]; }; then
            echo "::warning::Only one of SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY is set. This build runs in demo mode."
          fi

          {
            echo "SUPABASE_URL=$url"
            echo "SUPABASE_PUBLISHABLE_KEY=$key"
            echo "GOOGLE_WEB_CLIENT_ID=$google"
            echo "UPDATE_MANIFEST_URL=$manifest"
          } > .env.release

      - name: Build
        working-directory: product
        env:
          TIDE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIDE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TIDE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define-from-file=.env.release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/dist/tide-${{ needs.prepare.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, build]
    # Runs after a build, and also on its own (build skipped) to attach a
    # missing version.json to an existing release.
    if: >-
      always() &&
      needs.prepare.outputs.publish_manifest == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # main may have moved on since CI passed. The release describes the
      # commit that was tested, so the script reads that commit's copies.
      - name: Read the released commit's version and notes
        run: |
          git show "$SHA:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          git show "$SHA:product/pubspec.yaml" > "$RUNNER_TEMP/pubspec.yaml"
          echo "RELEASE_CHANGELOG=$RUNNER_TEMP/CHANGELOG.md" >> "$GITHUB_ENV"
          echo "RELEASE_PUBSPEC=$RUNNER_TEMP/pubspec.yaml" >> "$GITHUB_ENV"

      - name: Get the freshly built APK
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Get the APK from the existing release
        if: needs.build.result == 'skipped'
        run: gh release download "$TAG" --pattern "tide-$VERSION.apk" --dir dist

      - name: Write the update manifest
        env:
          APK_BASE_URL: ${{ vars.APK_BASE_URL }}
          MIN_SUPPORTED_VERSION: ${{ vars.MIN_SUPPORTED_VERSION || '1.0.0' }}
        run: |
          FILE="dist/tide-$VERSION.apk"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing."
            ls -la dist || true
            exit 1
          fi
          base="${APK_BASE_URL:-${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG}"
          node scripts/release.mjs manifest \
            --url "$base/tide-$VERSION.apk" \
            --sha256 "$(sha256sum "$FILE" | cut -d' ' -f1)" \
            --size "$(stat -c%s "$FILE")" \
            --min-supported "$MIN_SUPPORTED_VERSION" \
            --out dist/version.json
          cat dist/version.json

      # The APK and the manifest go up together, so "latest" never points at
      # a release whose version.json is not there yet.
      - name: Create the GitHub Release
        if: needs.build.result == 'success'
        run: |
          {
            node scripts/release.mjs notes "$VERSION"
            echo
            echo "---"
            echo "SHA-256 \`$(sha256sum "dist/tide-$VERSION.apk" | cut -d' ' -f1)\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "dist/tide-$VERSION.apk" dist/version.json \
            --target "$SHA" \
            --title "Tide $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      - name: Attach the manifest to the existing release
        if: needs.build.result == 'skipped'
        run: gh release upload "$TAG" dist/version.json --clobber

      # Without this the website finds the release on its own within
      # RELEASE_REVALIDATE (lib/release.ts). The site answers 409 until
      # GitHub's latest/download link serves the new manifest, so this retries
      # for a few minutes. A failure here never fails the release: the APK and
      # the manifest are already published.
      - name: Refresh the website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.SITE_REVALIDATE_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::notice::SITE_URL / SITE_REVALIDATE_SECRET not set, so the website picks up $VERSION on its own within 5 minutes (TRIGGER.md)."
            exit 0
          fi
          for attempt in $(seq 1 12); do
            status=$(curl -sS -o "$RUNNER_TEMP/revalidate.json" -w '%{http_code}' \
              -X POST "${SITE_URL%/}/api/revalidate" \
              -H "Authorization: Bearer $REVALIDATE_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"version\":\"$VERSION\"}") || status=000
            cat "$RUNNER_TEMP/revalidate.json" 2>/dev/null; echo
            case "$status" in
              200) echo "::notice::Website now shows $VERSION."; exit 0 ;;
              409|000|5*) echo "Attempt $attempt: not yet ($status). Waiting 20s."; sleep 20 ;;
              *) echo "::warning::Website refresh refused ($status). Check SITE_REVALIDATE_SECRET matches REVALIDATE_SECRET on the site."; exit 0 ;;
            esac
          done
          echo "::warning::The website did not confirm $VERSION. It will pick it up on its own within 5 minutes."
